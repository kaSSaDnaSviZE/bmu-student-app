name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  audit:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Reject committed keystores and private keys
        run: |
          set -euo pipefail
          if find . -path ./node_modules -prune -o \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pem' -o -name 'id_rsa' \) -print | grep -q .; then
            echo 'Refusing a committed keystore or private key.'
            exit 1
          fi
