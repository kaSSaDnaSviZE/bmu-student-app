services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bmu
      POSTGRES_PASSWORD: bmu
      POSTGRES_DB: bmu
    ports:
      - "5432:5432"
    volumes:
      - bmu_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmu -d bmu"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://bmu:bmu@postgres:5432/bmu?schema=public
      PORT: 3000
      # The image defaults to NODE_ENV=production, which refuses BMU_DATA_PROVIDER=mock.
      # This override is only for the local demo stack. Do not copy it into a real deploy.
      NODE_ENV: development
      BMU_DATA_PROVIDER: mock
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  bmu_pg:
